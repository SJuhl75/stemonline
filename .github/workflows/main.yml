name: Build and Push RunPod Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # HIER ERZWINGEN WIR DIE KLEINSCHREIBUNG FÜR DOCKER:
  IMAGE_NAME: sjuhl75/stemonline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Aktualisiert auf v4.2.2 für Node24-Kompatibilität
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Aktualisiert auf v3.3.0 für Node24-Kompatibilität
      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Aktualisiert auf v6.13.0 für Node24-Kompatibilität
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
